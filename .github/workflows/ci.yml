name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Evaluate all systems
        run: nix flake check --all-systems --no-build

      - name: Flake check
        run: nix flake check -L

      # The scheduled updater repairs hashes; CI verifies every source and unpacker.
      - name: Build font packages
        run: |
          nix build \
            .#sf-pro .#sf-compact .#sf-mono .#sf-arabic \
            .#sf-armenian .#sf-georgian .#sf-hebrew .#ny \
            --keep-going --no-link -L
