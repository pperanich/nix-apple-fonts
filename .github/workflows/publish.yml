name: Publish

on:
  push:
    tags:
      - "v?[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing tag to publish to FlakeHub"
        type: "string"
        required: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-13
            system: x86_64-darwin
          - runner: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: "${{ (inputs.tag != null) && format('refs/tags/{0}', inputs.tag) || '' }}"

      - uses: DeterminateSystems/determinate-nix-action@v3

      - uses: cachix/cachix-action@v16
        with:
          name: nix-apple-fonts
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: true

      - name: Build font packages
        run: |
          packages=$(nix eval --raw '.#packages.${{ matrix.system }}' --apply 'pkgs: builtins.concatStringsSep " " (map (n: ".#" + n) (builtins.attrNames pkgs))')
          nix build $packages

      - name: Push font packages to Cachix
        run: |
          for link in result*; do
            cachix push nix-apple-fonts "$(readlink -f "$link")"
          done

  flakehub:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: "${{ (inputs.tag != null) && format('refs/tags/{0}', inputs.tag) || '' }}"

      - uses: DeterminateSystems/determinate-nix-action@v3

      - uses: DeterminateSystems/flakehub-push@main
        with:
          visibility: public
          tag: "${{ inputs.tag }}"
          include-output-paths: true
