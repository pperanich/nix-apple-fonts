name: Update font hashes

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update-hashes:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/determinate-nix-action@v3

      # `fix hashes` only repairs mismatches the daemon has already seen, so
      # attempt the builds first to record any stale Apple DMG hashes.
      # Base packages cover all DMG fetches (nerd variants share the sources).
      - name: Attempt builds to record hash mismatches
        run: |
          nix build \
            .#sf-pro .#sf-compact .#sf-mono .#sf-arabic \
            .#sf-armenian .#sf-georgian .#sf-hebrew .#ny \
            --keep-going --no-link || true

      - run: determinate-nixd fix hashes --auto-apply

      - name: Verify builds after hash fixes
        run: |
          nix build \
            .#sf-pro .#sf-compact .#sf-mono .#sf-arabic \
            .#sf-armenian .#sf-georgian .#sf-hebrew .#ny \
            --keep-going --no-link

      - name: Update flake inputs, push, and tag release
        run: |
          if ! git diff --quiet; then
            # Font hashes changed — also bump nixpkgs and other inputs
            nix flake update

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add --all
            git commit -m "fix: update font hashes and flake inputs"
            git push

            # Auto-increment patch version and push tag to trigger FlakeHub publish
            latest=$(git tag --sort=-v:refversion --list 'v*' | head -1)
            if [ -z "$latest" ]; then
              next="v0.1.0"
            else
              next=$(echo "$latest" | awk -F. '{print $1"."$2"."$3+1}')
            fi
            git tag "$next"
            git push origin "$next"
          fi
